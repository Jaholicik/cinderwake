<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CINDERWAKE — forge defense arena</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b1e; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="CINDERWAKE: defend the last Forge from waves of void mites. Move with WASD, aim and shoot with the mouse, dash with Shift, loose an ember nova with E. Between waves, pick an upgrade and spend embers to raise Forge turrets. Survive wave 10 to win — or continue into endless waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
